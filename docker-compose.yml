services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: aetherc_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-aether_cms}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DB_PORT:-5433}:5432"
    networks:
      - aether_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queues
  redis:
    image: redis:7-alpine
    container_name: aetherc_redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - aether_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Meilisearch (Full-text search)
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: aetherc_meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-development-key}
    ports:
      - "${MEILISEARCH_PORT:-7701}:7700"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - aether_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aetherc_qdrant
    ports:
      - "${QDRANT_PORT:-6343}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - aether_network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /healthz HTTP/1.0\r\n\r\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Backend (Octane)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aetherc_backend
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_NAME:-aether_cms}
      DB_USERNAME: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEILISEARCH_HOST: meilisearch
      MEILISEARCH_PORT: 7700
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      SITE_URL: ${SITE_URL:-http://localhost:3100}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8100}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3100","http://127.0.0.1:3100","http://localhost:8100","http://localhost:8088"]}
    ports:
      - "${BACKEND_PORT:-8100}:8000"
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage
    networks:
      - aether_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aetherc_frontend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: http://backend:8000
      INTERNAL_API_URL: http://backend:8000
      SITE_URL: ${SITE_URL:-http://localhost:3100}
    ports:
      - "${FRONTEND_PORT:-3100}:3000"
    networks:
      - aether_network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<400?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: aetherc_nginx
    ports:
      - "${NGINX_PORT:-8088}:80"
      - "${NGINX_SSL_PORT:-8443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - aether_network
    depends_on:
      - backend
      - frontend

networks:
  aether_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  qdrant_data:
  backend_storage:
